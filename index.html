            margin-top: 10px;
            margin-right: 10px;

            display: inline-block;
            width: 1.2em;
            height: 1.2em;

            vertical-align: middle;
            border: 1px solid #888; /* ライトモードでの枠線 */

             text-align: center;

             padding-top: 0;
             padding-bottom: 0;

            overflow-x: auto;

        /* --- ダークモードのスタイル --- */

        body.dark-mode {

    // 期生のソート順序を定義
    function getGenerationSortValue(kisei) {
        if (kisei === 'チーム8') return 1;
        if (kisei === 'ドラフト2期') return 2;
        if (kisei === 'ドラフト3期') return 3;
        const match = kisei.match(/(\d+)期生/);
        if (match && match[1]) {
            return 100 + parseInt(match[1], 10); // 番号付き期生は100以降とする
        }
        return 999; // 定義されていない期生は最後に
    }

    function toggleColorFilter(colorSystem) {
        // activeColorFiltersに含まれていれば削除、含まれていなければ追加
        if (activeColorFilters.has(colorSystem)) {
            activeColorFilters.delete(colorSystem);
        } else {
            activeColorFilters.add(colorSystem);
        }
        // フィルター条件が変更されたら表示を更新
        updateTableDisplay();
        updateButtonStyles(); // ボタンのスタイルを更新
    }

     // フィルターと固定をすべて解除し、初期表示に戻す関数
    function resetFilter() {
        activeColorFilters.clear(); // フィルター条件をクリア

        currentSortOrder = 'initial'; // ソート順を初期状態に

        updateTableDisplay();

        updateSortButtonStyles(); // ソートボタンのスタイルをリセット
    }

     // ダークモードを切り替える関数
     function toggleDarkMode() {
         const body = document.body;
         body.classList.toggle('dark-mode'); // dark-modeクラスを付け外しする
         // 設定をlocalStorageに保存する
         if (body.classList.contains('dark-mode')) {
             localStorage.setItem('darkMode', 'enabled');
         } else {
             localStorage.setItem('darkMode', 'disabled');
         }
     }

     // 保存されているダークモード設定を読み込む関数
     function loadDarkModePreference() {
         const darkModePreference = localStorage.getItem('darkMode');
         const body = document.body;
         if (darkModePreference === 'enabled') {
             body.classList.add('dark-mode');
         } else if (darkModePreference === 'disabled') {
             body.classList.remove('dark-mode');
         }
         // OSの設定に合わせる場合は 'null' の場合に prefers-color-scheme を確認するロジックを追加
         // 今回はボタン切り替えとlocalStorage優先なので不要
     }


    // テーブル表示を更新するメイン関数
    function updateTableDisplay() {
        const tbody = document.getElementById("memberTable").querySelector("tbody");
        // tbodyの内容をクリア
        tbody.innerHTML = '';

        // 固定メンバーと非固定メンバーに分ける (rawMemberDataの元の順序を維持)
        let pinnedData = [];
        let unpinnedData = [];

        // rawMemberData（元のデータ）を基に処理
        rawMemberData.forEach(memberData => {
             const memberName = memberData[0]; // メンバー名
             if (pinnedMembers.has(memberName)) {
                 pinnedData.push(memberData);
             } else {
                 unpinnedData.push(memberData);
             }
        });

        // 非固定メンバーをフィルター
        let filteredUnpinnedData = unpinnedData.filter(memberData => {
            // activeColorFiltersが空の場合は全て表示
            if (activeColorFilters.size === 0) {
                return true;
            }

            const penlightColorsText = memberData[3]; // ペンライトカラー（元のテキスト）
            const penlightColors = penlightColorsText.split(' × ').map(c => c.trim());

            let isMatch = true;
            // 選択中の *全ての* 色系統に対してチェックを行う
            for (const filterColorSystem of activeColorFilters) {
                const targetColors = colorMap[filterColorSystem] || []; // その系統に含まれる色リスト

                // その系統に含まれる色のうち、少なくとも1つがメンバーのペンライトカラーに含まれているか？
                let hasColorFromSystem = false;
                for (const pColor of penlightColors) {
                    if (targetColors.includes(pColor)) {
                        hasColorFromSystem = true; // 1つでも含まれていればOK
                        break; // この系統のチェックは完了
                    }
                }

                // もし、選択中のいずれかの系統から色が見つからなかった場合、そのメンバーは条件を満たさない
                if (!hasColorFromSystem) {
                    isMatch = false; // 条件を満たさない
                    break; // 他の系統をチェックする必要はない
                }
            }
            return isMatch;
        });

        // フィルターされた非固定メンバーをソート
        if (currentSortOrder === 'az') {
             filteredUnpinnedData.sort((a, b) => a[5].toUpperCase().localeCompare(b[5].toUpperCase())); // アルファベット表記 (インデックス5) でソート
        } else if (currentSortOrder === 'za') {
            filteredUnpinnedData.sort((a, b) => b[5].toUpperCase().localeCompare(a[5].toUpperCase())); // アルファベット表記 (インデックス5) 逆順ソート
        } else if (currentSortOrder === 'birthday') {
            const now = new Date();
            const currentYear = now.getFullYear();
            filteredUnpinnedData.sort((a, b) => {
                const birthdayA = a[2]; // 生年月日 (インデックス2)
                const birthdayB = b[2]; // 生年月日 (インデックス2)

                if (!birthdayA || !birthdayA.includes('-') || !birthdayB || !birthdayB.includes('-')) {
                    return 0; // データ不備の場合は順序を変えない
                }

                const monthA = parseInt(birthdayA.substring(5, 7), 10) - 1;
                const dateA = parseInt(birthdayA.substring(8, 10), 10);
                const monthB = parseInt(birthdayB.substring(5, 7), 10) - 1;
                const dateB = parseInt(birthdayB.substring(8, 10), 10);

                const dateAThisYear = new Date(currentYear, monthA, dateA);
                const dateBThisYear = new Date(currentYear, monthB, dateB);

                let diffA = dateAThisYear.getTime() - now.getTime();
                let diffB = dateBThisYear.getTime() - now.getTime();

                if (diffA < 0) {
                    dateAThisYear.setFullYear(currentYear + 1);
                    diffA = dateAThisYear.getTime() - now.getTime();
                }
                if (diffB < 0) {
                    dateBThisYear.setFullYear(currentYear + 1);
                    diffB = dateBThisYear.getTime() - now.getTime();
                }
                return diffA - diffB;
            });
        } else if (currentSortOrder === 'generation') {
             // 期生順でソート (インデックス4)
             filteredUnpinnedData.sort((a, b) => getGenerationSortValue(a[4]) - getGenerationSortValue(b[4]));
        }
        // 'initial' の場合は rawMemberData の順序が維持される（分ける際に元の順序で処理されている）

        // 表示する最終的な行データリストを作成 (固定メンバー + ソート・フィルター済み非固定メンバー)
        const rowsToDisplay = [...pinnedData, ...filteredUnpinnedData];

        // テーブルヘッダーの列数を取得（セパレーター行のcolspanに使う）
        const tableHeader = document.getElementById("memberTable").querySelector("thead tr");
        const numberOfColumns = tableHeader ? tableHeader.cells.length : 1; // ヘッダーがない場合は1とする

        // tbodyにメンバーデータを追加
        rowsToDisplay.forEach((memberData, index) => {
            const memberName = memberData[0];
            const nickname = memberData[1];
            const birthday = memberData[2]; //YYYY-MM-DD 形式
            const penlightColorsText = memberData[3]; // 元のテキスト
            const kisei = memberData[4];
            const name = memberData[5]; // アルファベット表記

            const tr = document.createElement('tr');

            // 固定列 (1列目, インデックス0)
            const pinTd = document.createElement('td');
            pinTd.classList.add('pin-column');
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            // チェックボックスの状態をpinnedMembersと同期
            if (pinnedMembers.has(memberName)) {
                 checkbox.checked = true;
            }
            // onclickイベントでhandleCheckboxChangeを呼び出す
            checkbox.onclick = () => handleCheckboxChange(memberName, checkbox);
            pinTd.appendChild(checkbox);
            tr.appendChild(pinTd);


            // メンバー名 (2列目, インデックス1)
            const memberNameTd = document.createElement('td');
            memberNameTd.textContent = memberName;
            tr.appendChild(memberNameTd);

            // カラー (3列目, インデックス2) - 新しい表示順
            const colorTd = document.createElement('td');
            // ペンライトカラーの表示をレンダリング
            const colors = penlightColorsText.split(' × ').map(c => c.trim());
             let renderedColorsHtml = colors.map(color => {
                 const hex = colorNameToHex[color] || '#000000';
                 return `${color}<span class="color-block" style="background-color: ${hex};"></span>`;
             }).join(' '); // スペースで結合
            colorTd.innerHTML = renderedColorsHtml;
            tr.appendChild(colorTd);

            // ニックネーム (4列目, インデックス3) - 新しい表示順
            const nicknameTd = document.createElement('td');
            nicknameTd.textContent = nickname;
            tr.appendChild(nicknameTd);

            // 期生 (5列目, インデックス4) - 新しい表示順
            const kiseiTd = document.createElement('td');
            kiseiTd.textContent = kisei;
            tr.appendChild(kiseiTd);

            // 生年月日 (6列目, インデックス5) - 新しい表示順
            const birthdayTd = document.createElement('td');
            // 生年月日の表示を M/D(YYYY) 形式にフォーマット
            if (birthday && birthday.includes('-')) {
                 const parts = birthday.split('-');
                 if (parts.length === 3) {
                     const year = parts[0];
                     const month = parseInt(parts[1], 10);
                     const day = parseInt(parts[2], 10);
                     birthdayTd.textContent = `${month}/${day}(${year})`;
                 } else {
                     birthdayTd.textContent = birthday; // フォーマットできない場合は元のテキスト
                 }
            } else {
                 birthdayTd.textContent = birthday; // フォーマットできない場合は元のテキスト
            }
            tr.appendChild(birthdayTd);

            // NAME (7列目, インデックス6)
            const nameTd = document.createElement('td');
            nameTd.textContent = name;
            tr.appendChild(nameTd);


            tbody.appendChild(tr); // tbodyに行を追加

             // 固定メンバーリストの最後にセパレーター行を追加
             if (index === pinnedData.length - 1 && filteredUnpinnedData.length > 0) {
                 const separatorTr = document.createElement('tr');
                 separatorTr.classList.add('separator-row');
                 const separatorTd = document.createElement('td');
                 separatorTd.setAttribute('colspan', numberOfColumns);
                 separatorTr.appendChild(separatorTd);
                 tbody.appendChild(separatorTr);
             }

        });
    }


    // ボタンのスタイルを更新する関数 (アクティブなフィルターを表示)
    function updateButtonStyles() {
        // onclick属性がtoggleColorFilterで始まるボタンを選択
        const colorButtons = document.querySelectorAll('button[onclick^="toggleColorFilter("]');
        colorButtons.forEach(button => {
            // ボタンのonclick属性から色系統名を取得
            const onclickAttr = button.getAttribute('onclick');
            const match = onclickAttr.match(/toggleColorFilter\('([^']+)'\)/);
            if (match && match[1]) {
                const colorSystem = match[1];
                // activeColorFiltersに含まれているかチェックし、クラスを付け外し
                if (activeColorFilters.has(colorSystem)) {
                    button.classList.add('active-filter-button');
                } else {
                    button.classList.remove('active-filter-button');
                }
            }
        });
    }

     // ソートボタンのスタイルを更新する関数 (アクティブなソートを表示)
     function updateSortButtonStyles() {
         // ソートボタンを選択（onclick属性で識別）
         const sortButtons = document.querySelectorAll('button[onclick^="sortTable("], button[onclick^="sortBy"]');

         sortButtons.forEach(button => {
             // ボタンのonclick属性を取得
             const onclickAttr = button.getAttribute('onclick');
             let buttonSortOrder = '';

             // onclick属性からソートの種類を判定
             if (onclickAttr === "sortTable('az')") {
                 buttonSortOrder = 'az';
             } else if (onclickAttr === "sortTable('za')") {
                 buttonSortOrder = 'za';
             } else if (onclickAttr === "sortByClosestBirthday()") {
                 buttonSortOrder = 'birthday';
             } else if (onclickAttr === "sortByGeneration()") {
                  buttonSortOrder = 'generation';
             }
              // resetFilterボタンはソートのアクティブ状態は持たない

             // 現在のソート順と比較し、クラスを付け外し
             if (currentSortOrder === buttonSortOrder) {
                 button.classList.add('active-sort-button');
             } else {
                 button.classList.remove('active-sort-button');
             }
         });

         // 全てリセットボタン（resetFilter）はactive-sort-buttonクラスを持たないので別途スタイルが必要な場合はCSSで対応
          const resetButton = document.querySelector('button[onclick="resetFilter()"]');
          if (currentSortOrder === 'initial') {

              // resetButton.classList.add('active-reset');
          } else {

     }
